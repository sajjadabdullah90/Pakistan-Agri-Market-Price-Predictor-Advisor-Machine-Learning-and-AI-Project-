<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Pakistan Agri-Market Price Predictor & Advisor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.73.0/build/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #2e7b32;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 18px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .badge {
        background: #e8f5e9;
        color: #2e7b32;
        font-weight: 600;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
      <span class="badge">AI &amp; MACHINE LEARNING · STREAMLIT</span>
      <h2 style="margin: 0 0 8px; font-weight: 600;">Pakistan Agri-Market Price Predictor</h2>
      <p style="margin: 0; color: #64748b; font-size: 14px;">Loading Pyodide WebAssembly runtime, ML models &amp; 55-year dataset...</p>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.73.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: ["pandas", "numpy", "plotly", "scikit-learn", "requests", "streamlit-lottie"],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "producer-prices_pak.csv": { url: "./producer-prices_pak.csv" }
        }
      }, document.getElementById("root")).then(() => {
        const loader = document.getElementById("loading-screen");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(() => loader.remove(), 400);
        }
      });
    </script>
  </body>
</html>
